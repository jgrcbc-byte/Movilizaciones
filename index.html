<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador de Movilizaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: vista cenital de la habitación (escena) junto al panel de decisiones; en móvil, escena arriba y panel debajo. */
:root{
  --bg:#edf2f0; --surface:#fbfdfc; --ink:#13231f; --muted:#526b65; --line:#d0dcd8;
  --scrub:#11705f; --on-scrub:#ffffff; --scrub-soft:#d6ebe4;
  --ok:#277639; --ok-soft:#e1f0e3; --bad:#b4371e; --bad-soft:#f7e2dc;
  --floor:#e3e8e5; --wall:#9db0ab; --frame:#a3b1ae; --frame-dark:#7f908c; --mattress:#f6f9fa; --fowler:#c3d9e1;
  --sheet:#b7d1db; --sheet-fold:#a2c3cf; --skin:#e0ad8b; --gown:#87aac8; --gown-dark:#6a8fb0; --robe:#b5805d;
  --hair:#4a392e; --pillow:#ffffff; --pillow-line:#c3cfd2; --chair:#4f5c69; --seat:#7c8995; --str:#b9c5ca; --str-top:#eef3f5;
  --puddle:#8bc2e5; --box:#c09f76; --biombo:#9fb4ae; --window:#bfe0ee; --blanket:#c9a9c9;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1715; --surface:#14201e; --ink:#e3eeeb; --muted:#93aba5; --line:#28403b;
    --scrub:#43b9a3; --on-scrub:#04201a; --scrub-soft:#16352f;
    --ok:#62c474; --ok-soft:#173222; --bad:#ff8169; --bad-soft:#3a1d17;
    --floor:#18221f; --wall:#3c4f4a; --frame:#4f625e; --frame-dark:#6b7f7a; --mattress:#26333a; --fowler:#3a5562;
    --sheet:#3b5966; --sheet-fold:#476a78; --skin:#d29f7e; --gown:#5f8aaf; --gown-dark:#4b7397; --robe:#a06e4e;
    --hair:#2b211b; --pillow:#dfe4e2; --pillow-line:#9fabaa; --chair:#9aa7b4; --seat:#5d6974; --str:#4c5a60; --str-top:#33434a;
    --puddle:#3f86b5; --box:#9c7d58; --biombo:#5d726c; --window:#2f5566; --blanket:#7d607d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1715; --surface:#14201e; --ink:#e3eeeb; --muted:#93aba5; --line:#28403b;
  --scrub:#43b9a3; --on-scrub:#04201a; --scrub-soft:#16352f;
  --ok:#62c474; --ok-soft:#173222; --bad:#ff8169; --bad-soft:#3a1d17;
  --floor:#18221f; --wall:#3c4f4a; --frame:#4f625e; --frame-dark:#6b7f7a; --mattress:#26333a; --fowler:#3a5562;
  --sheet:#3b5966; --sheet-fold:#476a78; --skin:#d29f7e; --gown:#5f8aaf; --gown-dark:#4b7397; --robe:#a06e4e;
  --hair:#2b211b; --pillow:#dfe4e2; --pillow-line:#9fabaa; --chair:#9aa7b4; --seat:#5d6974; --str:#4c5a60; --str-top:#33434a;
  --puddle:#3f86b5; --box:#9c7d58; --biombo:#5d726c; --window:#2f5566; --blanket:#7d607d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:800;line-height:1}
h2{font-size:1.35rem;font-weight:800;line-height:1.1}
h3{font-size:1.18rem;font-weight:600;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--scrub)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}

/* Home */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px 18px;max-width:46rem}
.hero p{color:var(--muted);font-size:1.02rem;max-width:62ch}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-block:6px 18px}
.tabs button{border:0;background:transparent;padding:10px 16px;border-radius:9px;font-weight:700;color:var(--muted);min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--scrub);color:var(--on-scrub)}
.modeNote{color:var(--muted);font-size:.95rem;margin-bottom:16px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--scrub)}
.card:active{transform:scale(.99)}
.card .num{grid-row:span 3;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--scrub);min-width:1.4ch}
.card .cat{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .nm{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.2}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.8rem;white-space:nowrap}
.pill.good{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}

/* Sim */
.simTop{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:700;white-space:nowrap}
.simTitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.simGrid{display:grid;gap:14px}
@media (min-width:880px){.simGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.sceneBox{position:sticky;top:12px}}
.sceneBox{background:var(--floor);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
#scene{display:block;width:100%;height:min(44vh,430px);max-width:100%}
@media (min-width:880px){#scene{height:min(calc(100vh - 190px),620px)}}
.sceneBox.danger{animation:shake .45s;outline:3px solid var(--bad);outline-offset:-3px}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding-bottom:4px}
.chip{font-size:.76rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface);transition:all .3s}
.chip.on{background:var(--scrub-soft);border-color:transparent;color:var(--scrub);font-weight:700}
.chip.on::before{content:"✓ "}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prog{display:flex;align-items:center;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--scrub);border-radius:99px;transition:width .4s}
.ctx{padding:10px 12px;border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem;border-left:3px solid var(--scrub)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);line-height:1.35;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--scrub)}
.opt:disabled{cursor:default}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:-1px;font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--scrub);background:var(--scrub-soft)}
.opt.sel .mk{background:var(--scrub);border-color:var(--scrub);color:var(--on-scrub)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .mk{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.opts.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.figs .opt{flex-direction:column;align-items:center;text-align:center;font-size:.84rem;padding:10px 8px;gap:6px}
.fig{width:64px;height:82px}
.fig circle{fill:var(--ink)}
.fig path{stroke:var(--ink);stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig rect{fill:var(--box)}
.fig .figFloor{stroke:var(--line);stroke-width:2}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;line-height:1.45}
.fb.ok{background:var(--ok-soft);color:var(--ink)}
.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.fb.bad b{color:var(--bad)}
.primary{border:0;background:var(--scrub);color:var(--on-scrub);border-radius:12px;padding:14px 18px;min-height:52px;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.primary:active{transform:scale(.98)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > *{flex:1 1 180px}
.case{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.case dt{color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding-top:2px}
.case dd{margin:0}
.hint{font-size:.88rem;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-weight:700}
.lst{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.lst li::marker{color:var(--muted)}
.box2{display:grid;gap:10px}
@media (min-width:560px){.box2{grid-template-columns:1fr 1fr}}
.kbox{padding:12px 14px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.kbox h4{margin:0;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.kbox.k h4{color:var(--ok)} .kbox.e h4{color:var(--bad)}
.errs{display:flex;flex-direction:column;gap:8px}
.err{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.err i{font-style:normal;color:var(--bad);font-weight:700}

/* Checklist */
.chk{max-width:760px;display:flex;flex-direction:column;gap:14px}
.citem{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:52px}
.citem .bx{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--on-scrub)}
.citem[aria-pressed="true"]{border-color:var(--scrub);background:var(--scrub-soft)}
.citem[aria-pressed="true"] .bx{background:var(--scrub);border-color:var(--scrub)}
.citem.er[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.citem.er[aria-pressed="true"] .bx{background:var(--bad);border-color:var(--bad)}
.citem .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;min-width:1.6ch}
.tip{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tip p{font-size:.95rem}
.sticky{position:sticky;bottom:0;padding-block:10px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tally{font-family:var(--display);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}

/* Identificación y panel de notas */
.idcard{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:16px}
.idcard.need{border-color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 220px;min-width:0}
.field label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--scrub);outline-offset:1px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.who b{font-family:var(--display);font-size:1.15rem}
.tctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px}
.tctl .field{flex:0 1 220px}
.tctl .row{flex:1 1 260px;justify-content:flex-end}
.tctl .row > *{flex:0 0 auto}
.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-block:10px 16px}
table.notes{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.notes th,table.notes td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
table.notes th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
table.notes td.c,table.notes th.c{text-align:center}
table.notes tr:last-child td{border-bottom:0}
tr.trow{cursor:pointer}
tr.trow:hover td{background:var(--bg)}
tr.trow.sel td{background:var(--scrub-soft)}
tr.trow:focus-visible{outline:3px solid var(--scrub);outline-offset:-3px}
.nota{font-family:var(--display);font-weight:800;font-size:1.05rem}
.lo{color:var(--bad)} .hi{color:var(--ok)}
.sub{display:block;font-size:.7rem;color:var(--muted)}
.wrap{white-space:normal!important;min-width:240px}
.wrap ul{margin:0;padding-left:1em;font-size:.84rem;color:var(--muted)}
.empty{padding:28px 18px;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;min-height:110px;resize:vertical}
details.tip summary{cursor:pointer;font-weight:700;font-family:var(--display);min-height:30px;display:flex;align-items:center}
details.tip[open]{gap:10px}
.det{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.danger-btn{border:1.5px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:700}

/* SVG scene */
#scene .floor{fill:var(--floor)}
#scene .wallLine{fill:none;stroke:var(--wall);stroke-width:6}
#scene .door{fill:none;stroke:var(--wall);stroke-width:2;stroke-dasharray:4 4}
#scene .doorLeaf{stroke:var(--wall);stroke-width:4}
#scene .window{fill:var(--window)}
#scene .roomLbl{font:700 11px var(--body);letter-spacing:.14em;fill:var(--muted)}
#scene .frame{fill:var(--frame)}
#scene .frameDark{fill:var(--frame-dark)}
#scene .mattress{fill:var(--mattress)}
#scene .bedLbl{font:700 10px var(--body);fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
#scene .wheel{fill:var(--frame-dark);transition:fill .3s}
#scene .wheel.on{fill:var(--ok)}
#scene .tagOk{fill:var(--ok)}
#scene .tagTxt{font:700 10px var(--body);fill:var(--surface);text-anchor:middle;letter-spacing:.04em}
#scene .fade{transition:opacity .5s}
#scene .gown{fill:var(--gown)}
#scene .robe .gown{fill:var(--robe)}
#scene .limb{fill:none;stroke:var(--gown);stroke-linecap:round;stroke-linejoin:round}
#scene .robe .limb{stroke:var(--robe)}
#scene .limbDark{fill:none;stroke:var(--gown-dark);stroke-linecap:round}
#scene .robe .limbDark{stroke:var(--robe)}
#scene .knee{fill:var(--gown-dark);opacity:.5}
#scene .spine{stroke:var(--gown-dark);stroke-width:2;fill:none}
#scene .skin{fill:var(--skin)}
#scene .hair{fill:var(--hair)}
#scene .eye{fill:var(--hair)}
#scene .slipper{fill:var(--chair)}
#scene .sheet{fill:var(--sheet);opacity:.94}
#scene .sheetFold{fill:var(--sheet-fold)}
#scene .entre{fill:var(--sheet-fold);opacity:.8}
#scene .pillow{fill:var(--pillow);stroke:var(--pillow-line);stroke-width:1.5}
#scene .blanket{fill:var(--blanket);opacity:.92}
#scene .tire{fill:var(--chair)}
#scene .seat{fill:var(--seat)}
#scene .seatDark{fill:var(--chair)}
#scene .str{fill:var(--str)}
#scene .strTop{fill:var(--str-top)}
#scene .badge{fill:var(--ok)}
#scene .badgeT{font:800 9px var(--body);fill:var(--surface);text-anchor:middle}
#scene .scrub{fill:var(--scrub)}
#scene .auxHead{fill:var(--hair)}
#scene .auxTag{fill:var(--surface);stroke:var(--scrub);stroke-width:1.5}
#scene .auxLbl{font:800 10px var(--body);fill:var(--scrub);text-anchor:middle}
#scene .puddle{fill:var(--puddle);opacity:.75}
#scene .boxH{fill:var(--box)}
#scene .biombo{fill:none;stroke:var(--biombo);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
#scene .mv{transition:transform .9s cubic-bezier(.45,.05,.2,1),opacity .4s;transform-box:view-box;transform-origin:0 0}
#scene.noanim .mv{transition:none!important}
#scene .pop{animation:pop .5s ease}
@keyframes pop{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#scene .mv{transition-duration:.01s!important}#scene .pop{animation:none}.sceneBox.danger{animation:none}}
</style>
</head>
<body>

<div class="app"><main id="view"></main></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const view = $('#view');
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sg = s => s==='p' ? -1 : 1;
const nm = s => s==='p' ? 'puerta' : 'ventana';
const opp = s => s==='p' ? 'v' : 'p';
const AX = s => s==='p' ? 104 : 336;
const YY = {head:140, chest:190, hips:248, thighs:300, legs:350};
const DOOR = [[62,478],[62,528],[112,528]];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const STANDALONE = true;
const CAP = {ready:true, db:null, user:null, dl:null, uid:null, owner:false, saveBroken:true};
const capReady = Promise.resolve();

let alumno = store.get('movi-alumno', null);
const histAll = () => store.get('movi-hist', []);
function pushHist(att){ const h = histAll().filter(x => x.id !== att.id); h.push(att); store.set('movi-hist', h.slice(-80)); }
function myAttempts(){ const k = norm(alumno ? alumno.nombre : ''); return histAll().filter(x => norm(x.nombre) === k); }
const slimAtt = (a, ne, nl) => Object.assign({}, a, {errs:(a.errs||[]).slice(0,ne).map(x=>cut(x,nl)), nombre:undefined, grupo:undefined});
function allCode(){ const as = myAttempts(); return as.length ? encCode({n:alumno.nombre, g:alumno.grupo, as: as.map(a => slimAtt(a,4,60))}) : ''; }
let editingId = false;
const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const cut = (s, n) => { s = String(s||''); return s.length > n ? s.slice(0, n-1) + '…' : s; };
const fmt1 = x => x.toFixed(1).replace('.', ',');

const KEY = 'TCB-movilizaciones-2026';
function fnv(s){ let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function encCode(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let bin = '';
  b.forEach((x,i) => { bin += String.fromCharCode(x ^ (KEY.charCodeAt(i % KEY.length) & 255)); });
  const p = btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'MOV1.' + p + '.' + fnv(p + KEY);
}
function decCode(code){
  const m = /^MOV1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)$/.exec(String(code).trim()); if (!m) return null;
  if (fnv(m[1] + KEY) !== m[2]) return null;
  try {
    let s = m[1].replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
    const bin = atob(s), b = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i) ^ (KEY.charCodeAt(i % KEY.length) & 255);
    return JSON.parse(new TextDecoder().decode(b));
  } catch(e){ return null; }
}
function cleanAtt(a){
  if (!a || typeof a !== 'object') return null;
  const f = +a.f, n = +a.n, ok = +a.ok;
  if (!(f>=1 && f<=7) || !(n>0) || !(ok>=0)) return null;
  return {id:String(a.id||'').slice(0,40), f, n, ok:Math.min(ok,n), colab: a.colab===true?true:(a.colab===false?false:null),
    t:String(a.t||''), dur:Math.max(0, +a.dur||0), errs:Array.isArray(a.errs)?a.errs.slice(0,12).map(x=>cut(x,120)):[]};
}
let saveChain = Promise.resolve();
function saveAttempt(att){
  const run = async () => {
    await capReady;
    if (!(CAP.db && CAP.uid) || CAP.saveBroken) return {ok:false};
    const ref = CAP.db.doc('intentos/' + CAP.uid);
    for (let tries=0; tries<2; tries++){
      try {
        const snap = await ref.get();
        const d = snap.exists ? snap.data() : {};
        const prev = Array.isArray(d.attempts) ? d.attempts.filter(x => x && x.id !== att.id) : [];
        await ref.set({nombre:att.nombre, grupo:att.grupo, actualizado:att.t, attempts: prev.concat([att]).slice(-250)});
        return {ok:true};
      } catch(e){
        if (e && e.code === 'unavailable' && tries === 0){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); continue; }
        if (!(e && e.code === 'quota_exceeded')) CAP.saveBroken = true;
        return {ok:false};
      }
    }
    return {ok:false};
  };
  const p = saveChain.then(run, run); saveChain = p.catch(() => {}); return p;
}
async function copyText(text, ta){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){ if (ta){ ta.focus(); ta.select(); } return false; }
}

  aula:'Sobre colchoneta y suelo liso. Si el paciente colabora: rodillas flexionadas y empuje con los talones. Si no colabora: una sábana doblada hace de entremetida y se arrastra sin levantar.',
  setup(c){ c.n = c.colab?1:2; c.goal = 'Ha resbalado hacia los pies de la cama. Súbelo hacia la cabecera.'; },
  init(S){ S.py=1; },
  steps(c){ const one=c.n===1;
    const comun = [
      auxCount(c.n, one ? 'Si el paciente colabora, basta con 1 auxiliar.' : 'Si no colabora, hacen falta 2 auxiliares, uno a cada lado.'),
      rutinaIni(),
      almohadaCab()
    ];
    const colab = [
      {type:'choice', q:'¿Qué le pides al paciente?', ck:'Pide que flexione las rodillas, apoye las plantas y se agarre al cabecero',
        opts:[
          {t:'Que flexione las rodillas con las plantas de los pies apoyadas en la cama y, si puede, que se agarre al cabecero', ok:true},
          {t:'Que estire las piernas y se relaje', fb:'Necesitas que haga palanca: rodillas flexionadas y plantas apoyadas.'},
          {t:'Que se agarre a mi cuello', fb:'Te cargaría su peso en el cuello. Que se agarre al cabecero, si puede.'}
        ], a:S=>{S.leg={p:'flex',v:'flex'}; S.arm={p:'up',v:'up'}; setAux(S,[['Tú',AX('v'),YY.hips+30]]);}},
      {type:'choice', q:'¿Qué le explicas antes de empezar?', ck:'Le explica que se impulse con los talones a la señal',
        opts:[
          {t:'Que, cuando le dé la señal, se impulse haciendo palanca con los talones', ok:true},
          {t:'Que empuje con las manos contra el colchón cuando quiera', fb:'Tiene que moverse a la vez que tú, a tu señal, y el impulso sale de los talones.'},
          {t:'Nada, para que no se ponga nervioso', fb:'Si sabe qué hacer, el esfuerzo es menor para los dos. Explícale que se impulse con los talones a tu señal.'}
        ]},
      posture(),
      {type:'choice', q:'¿Dónde pones las manos?', ck:'Una mano bajo la espalda y otra bajo los glúteos',
        opts:[
          {t:'Una mano bajo su espalda y la otra bajo los glúteos', ok:true},
          {t:'Lo sujeto por las axilas y tiro hacia arriba', danger:true, fb:'Error frecuente: tirar de las axilas o los brazos puede lesionarle los hombros.'},
          {t:'Una mano en la nuca y otra en los tobillos', fb:'Así no ayudas a desplazar el peso. Una mano bajo la espalda y otra bajo los glúteos.'}
        ]},
      {type:'choice', q:'¿Cómo lo subes?', ck:'A la señal, le ayuda a deslizarse hacia la cabecera',
        opts:[
          {t:'Doy la señal y le ayudo a deslizarse hacia la cabecera mientras se impulsa', ok:true},
          {t:'Lo arrastro yo sin avisarle', fb:'Error frecuente: moverse sin una señal común. Él debe impulsarse a la vez que tú.'}
        ], a:S=>{S.py=0}}
    ];
    const nocolab = [
      {type:'choice', q:'¿Cómo os colocáis?', ck:'Un auxiliar a cada lado, piernas flexionadas y orientadas hacia la cabecera',
        opts:[
          {t:'Uno a cada lado de la cama, con las piernas ligeramente flexionadas, una delante de la otra y orientadas hacia la cabecera', ok:true},
          {t:'Los dos en el mismo lado', fb:'Desde un solo lado, el cuerpo se ladea. Uno a cada lado.'},
          {t:'Uno en la cabecera tirando de los brazos y otro empujando desde los pies', danger:true, fb:'Tirar de los brazos puede lesionar los hombros. Uno a cada lado de la cama.'}
        ], a:S=>setAux(S,[['A1',AX('p'),YY.chest+20],['A2',AX('v'),YY.chest+20]])},
      posture(),
      {type:'choice', q:'¿Cómo lo sujetáis?', ck:'Sujeción bajo cuello, hombro y zona lumbar (o entremetida)',
        opts:[
          {t:'Los dos lo sujetamos por debajo del cuello, el hombro y la zona lumbar', ok:true, fb:'Correcto. También podéis usar una entremetida, que facilita el deslizamiento.'},
          {t:'Usamos una entremetida: cada uno la sujeta por su lado y lo deslizamos sobre ella', ok:true, fb:'Es la opción más fácil con un paciente que no colabora: se desliza sin levantarlo.', a:S=>{S.entre=true}},
          {t:'Cada uno lo agarra de un brazo', danger:true, fb:'Error frecuente: tirar de los brazos o de las axilas.'}
        ]},
      {type:'choice', q:'¿Cómo lo desplazáis?', ck:'Uno da la señal y se mueven a la vez hacia la cabecera',
        opts:[
          {t:'Uno da la señal y lo desplazamos a la vez hacia la cabecera', ok:true},
          {t:'Cada uno tira cuando puede', fb:'Error frecuente: moverse sin una señal común. El cuerpo se tuerce.'}
        ], a:S=>{S.py=0}}
    ];
    const fin = [
      {type:'choice', ctx:'Ya está a la altura correcta.', q:'¿Qué haces con la almohada?', ck:'Coloca la almohada bajo la cabeza',
        opts:[
          {t:'Se la coloco bajo la cabeza', ok:true},
          {t:'La dejo en el cabecero por si vuelve a resbalar', fb:'Ya no hace falta allí: colócala bajo su cabeza y acomódalo.'}
        ], a:S=>{S.pillow='head'; S.leg={p:'straight',v:'straight'}; S.arm={p:'side',v:'side'}; S.entre=false;}},
      rutinaFin()
    ];
    return comun.concat(one?colab:nocolab, fin);
  }
},
{ id:4, cat:'Preparación para levantarse', name:'Sentar en la orilla', para:'Paso previo a caminar o a pasar al sillón o la silla de ruedas.', personal:'1 auxiliar', variants:false,
  clave:['Elevar y girar es un único movimiento: el cuerpo pivota sobre los glúteos.','Quédate delante del paciente mientras está sentado: puede perder el equilibrio.','Si se marea, palidece o suda, vuelve a acostarlo y avisa a la enfermera/o.'],
  errores:['Dejarlo solo sentado en el borde.','Separar el movimiento en dos tiempos.','Continuar sin comprobar si se marea.'],
  aula:'En una silla o banco: ensayad la presa (un brazo tras la cabeza hasta el hombro alejado y otro sobre las rodillas) y el giro sobre los glúteos. El observador comprueba que el auxiliar se queda delante.',
  setup(c){ c.n=1; c.colabTxt='Colabora un poco: se mueve si le ayudas.'; c.goal=`Sentarlo en la orilla de la cama, por el lado de la ${nm(c.side)}.`; },
  init(S){ setAux(S,[['Tú',DOOR[0][0],DOOR[0][1]]]); },
  steps(c){ const E=c.side; return [

    {type:'choice', q:'Primer paso de la ejecución:', ck:'Acerca al paciente a la orilla por la que se va a sentar',

        {t:'Lo siento desde el centro de la cama', fb:'Desde el centro sus piernas no llegan al borde y tendrías que cargar con su peso.'}

    {type:'choice', q:'¿Qué haces con la cama?', ck:'Eleva la cabecera hasta Fowler',
      opts:[
        {t:'Elevo la cabecera hasta la posición de Fowler', ok:true, fb:'Semisentado, el giro cuesta mucho menos.'},
        {t:'La dejo horizontal', fb:'Si elevas la cabecera hasta Fowler, no tienes que levantar tú el tronco del paciente.'},
        {t:'Le quito el freno para acercarla a la pared', danger:true, fb:'La cama debe estar frenada durante toda la técnica.'}
      ], a:S=>{S.bedHead='fowler'}},
    {type:'choice', q:'¿Cómo lo sujetas?', ck:'Un brazo tras la cabeza hasta el hombro alejado; el otro sobre las rodillas',
      opts:[
        {t:'Paso un brazo por detrás de su cabeza hasta el hombro más alejado, y el otro por encima de sus rodillas', ok:true},
        {t:'Lo cojo por las axilas y tiro hacia arriba', danger:true, fb:'Tirar de las axilas puede lesionarle los hombros.'},
        {t:'Un brazo bajo los glúteos y el otro bajo los pies', fb:'Así no controlas el tronco. Un brazo tras la cabeza hasta el hombro alejado y el otro sobre las rodillas.'}
      ]},
    {type:'choice', q:'¿Cómo lo sientas?', ck:'Eleva y gira en un solo movimiento',
      opts:[
        {t:'En un solo movimiento, elevo y giro su cuerpo hasta dejarlo sentado con las piernas colgando', ok:true, fb:'El cuerpo pivota sobre los glúteos.'},
        {t:'Primero lo incorporo y después, en otro movimiento, le bajo las piernas', fb:'Elevar y girar es un único movimiento: el cuerpo pivota sobre los glúteos.'},
        {t:'Le pido que se siente solo mientras preparo la bata', danger:true, fb:'Necesita tu ayuda y tu presencia: puede perder el equilibrio.'}
      ], a:S=>{S.pose='sentado'; S.sitSide=E; setAux(S,[['Tú',220+sg(E)*118,YY.head]]);}},
    {type:'choice', ctx:'Ya está sentado en el borde.', q:'¿Dónde te colocas?', ck:'Se queda delante del paciente mientras está sentado',
      opts:[
        {t:'Delante de él, porque puede perder el equilibrio', ok:true},
        {t:'Voy al armario a por la bata y las zapatillas', danger:true, fb:'No lo dejes solo en el borde: puede perder el equilibrio. Ten el material preparado antes de empezar.'},
        {t:'Me subo a la cama, detrás de él', fb:'Desde detrás no puedes frenar una caída hacia delante. Ponte delante.'}
      ], a:S=>setAux(S,[['Tú',220+sg(E)*162,240]])},
    {type:'choice', q:'¿Qué haces ahora?', ck:'Le ayuda a ponerse la bata y las zapatillas',
      opts:[
        {t:'Le ayudo a ponerse la bata y las zapatillas', ok:true},
        {t:'Lo pongo de pie descalzo, que luego se las pone', danger:true, fb:'Descalzo puede resbalar. Primero la bata y las zapatillas.'},
        {t:'Lo dejo en pijama, la bata no hace falta', fb:'La bata preserva su intimidad y le abriga; las zapatillas evitan resbalones.'}
      ], a:S=>{S.gown=true}},
    c.dizzy ?
    {type:'choice', ctx:`${c.p.f} dice que está mareado. Lo notas pálido y sudoroso.`, q:'¿Qué haces?', ck:'Comprueba que no se marea; si se marea, lo acuesta y avisa',
      opts:[
        {t:'Lo vuelvo a acostar y aviso a la enfermera/o', ok:true, fb:'Tras mucho tiempo tumbado, al incorporarse le puede bajar la tensión arterial.'},
        {t:'Lo pongo de pie para que se active', danger:true, fb:'Podría desmayarse y caer. Vuelve a acostarlo y avisa a la enfermera/o.'},
        {t:'Le doy un vaso de agua y seguimos', fb:'Mareo, palidez y sudor indican que hay que parar: vuelve a acostarlo y avisa.'}
      ], a:S=>{S.pose='supino'; S.px=sg(E); setAux(S,[['Tú',AX(E),YY.hips]]);}}
    :
    {type:'choice', q:'Antes de continuar con cualquier otro paso, ¿qué compruebas?', ck:'Comprueba que no se marea; si se marea, lo acuesta y avisa',
      opts:[
        {t:'Que no se marea: le pregunto y observo si está pálido o sudoroso', ok:true, fb:'Al incorporarse tras mucho tiempo tumbado puede bajarle la tensión arterial.'},
        {t:'Que tiene los brazos cruzados', fb:'Lo que hay que vigilar ahora es si se marea.'},
        {t:'Nada, ya está sentado', fb:'Tras estar tumbado puede bajarle la tensión. Comprueba que no se marea.'}
      ]},
    cierre()
  ];}
},
{ id:5, cat:'Traslado', name:'Cama a silla de ruedas', para:'Levantar al paciente de la cama y sentarlo en el sillón o la silla de ruedas.', personal:'1 auxiliar · 2 si no colabora', variants:true,
  clave:['La silla de ruedas siempre frenada antes de mover al paciente.','Reposapiés levantados durante el traslado y bajados al terminar.','Para volver a la cama se siguen los mismos pasos en orden inverso.'],
  errores:['Colocar la silla lejos de la cama: obliga a cargar el peso.','Girar retorciendo la cintura en lugar de mover los pies.'],
  aula:'Se reproduce casi igual con dos sillas: una hace de cama (el paciente ya sentado en el borde) y otra de silla de ruedas, a la altura de los pies. Si el centro tiene una silla de ruedas, mejor.',
  setup(c){ c.n = c.colab?1:2; c.goal=`Pasarlo de la cama a la silla de ruedas, por el lado de la ${nm(c.side)}.`; },
  init(S){ S.chair={x:410, y:522, r:90, brake:false, foot:'down', noArm:0}; },
  steps(c){ const E=c.side, s=sg(E);
    if (c.colab) return [
      auxCount(1, 'Si el paciente colabora, basta con 1 auxiliar.'),
      rutinaIni(),
      {type:'choice', q:'¿Dónde colocas la silla de ruedas?', ck:'Coloca la silla junto a la cama, a la altura de los pies',
        opts:[
          {t:`Junto a la cama, en el lado de la ${nm(E)}, a la altura de los pies`, ok:true},
          {t:'Donde está, al fondo de la habitación', danger:true, fb:'Error frecuente: con la silla lejos tendrás que cargar con su peso.'},
          {t:`En el lado de la ${nm(opp(E))}`, fb:'La silla va en el lado por el que se va a sentar y levantar.'}
        ], a:S=>{S.chair=Object.assign(S.chair,{x:220+s*130, y:372, r:180-30*s});}},
      {type:'choice', q:'Antes de mover al paciente, ¿qué haces con la silla?', ck:'Frena la silla y levanta los reposapiés',
        opts:[
          {t:'La freno y levanto los reposapiés', ok:true},
          {t:'Nada, ya está en su sitio', danger:true, fb:'La silla de ruedas siempre se frena antes de mover al paciente.'},
          {t:'Bajo los reposapiés para que apoye los pies al girar', fb:'Los reposapiés van levantados durante el traslado, para que no tropiece. Se bajan al terminar.'}
        ], a:S=>{S.chair.brake=true; S.chair.foot='up';}},
      {type:'choice', q:'¿Cuál es el paso previo?', ck:'Sienta al paciente en la orilla (ficha 4)',
        opts:[
          {t:'Sentarlo en la orilla de la cama (ficha 4)', ok:true},
          {t:'Levantarlo directamente desde tumbado', danger:true, fb:'Primero debe sentarse en la orilla: es el paso previo al traslado.'}
        ], a:(S,later)=>{S.px=s; S.bedHead='fowler'; S.pillow='headboard'; setAux(S,[['Tú',AX(E),YY.hips]]);
          later(()=>{S.pose='sentado'; S.sitSide=E; setAux(S,[['Tú',220+s*162,226]]);}, 950);}},
      {type:'choice', q:'Ya está sentado. ¿Y ahora?', ck:'Comprueba que no se marea y le pone bata y zapatillas',
        opts:[
          {t:'Compruebo que no se marea y le pongo la bata y las zapatillas', ok:true},
          {t:'Lo levanto enseguida, ahora que está despierto', danger:true, fb:'Primero comprueba que no se marea y ponle bata y zapatillas.'}
        ], a:S=>{S.gown=true}},
      posture('Te colocas frente a él. ¿Qué postura adoptas?'),
      {type:'choice', q:'¿Cómo lo sujetas?', ck:'Lo sujeta por la cintura; el paciente se apoya en sus hombros o cuello',
        opts:[
          {t:'Por la cintura con las dos manos; él se apoya en mis hombros o me rodea el cuello', ok:true},
          {t:'Tiro de sus manos para levantarlo', danger:true, fb:'Tirar de las manos lo desequilibra y te carga la espalda. Sujétalo por la cintura.'},
          {t:'Me pongo detrás y lo sujeto por las axilas', fb:'Esa es la técnica con 2 auxiliares para un paciente que no colabora.'}
        ]},
      {type:'choice', q:'¿Dónde quedan vuestras rodillas?', ck:'Rodillas muy próximas a las del paciente',
        opts:[
          {t:'Muy próximas: así lo controlo si se le doblan las piernas', ok:true},
          {t:'Separadas, para dejarle sitio', fb:'Si se le doblan las piernas no podrías sujetarlo. Tus rodillas deben quedar muy próximas a las suyas.'}
        ]},
      {type:'choice', q:'Se pone de pie. ¿Cómo lo llevas a la silla?', ck:'Gira a la vez que el paciente moviendo los pies, sin torcer la cintura',
        opts:[
          {t:'Giro a la vez que él, moviendo los pies, hasta dejarlo delante de la silla, y lo siento', ok:true},
          {t:'Giro la cintura con los pies quietos', danger:true, fb:'Error frecuente: gira con los pies, nunca retorciendo la cintura.'},
          {t:'Lo suelto y le pido que se siente él', danger:true, fb:'No lo sueltes hasta que esté sentado y acomodado.'}
        ], a:S=>{S.pose='silla'; const ch=S.chair, r=ch.r*Math.PI/180; setAux(S,[['Tú', ch.x - Math.sin(r)*66, ch.y + Math.cos(r)*66]]);}},
      {type:'choice', ctx:'Ya está en la silla.', q:'¿Qué te falta?', ck:'Baja los reposapiés y acomoda al paciente (manta si hace falta)',
        opts:[
          {t:'Bajo los reposapiés, apoyo sus pies y lo acomodo; si hace falta, lo tapo con una manta', ok:true},
          {t:'Le quito el freno y nos vamos', fb:'Antes, reposapiés bajados con los pies apoyados y el paciente bien acomodado.'}
        ], a:S=>{S.chair.foot='down'; S.blanket=true;}},
      cierre()
    ];
    return [
      auxCount(2, 'Si el paciente no colabora, hacen falta 2 auxiliares.'),
      rutinaIni(),
      {type:'choice', q:'Primer paso de la ejecución:', ck:'Lleva al paciente a la orilla y eleva la cabecera a Fowler',
        opts:[
          {t:`Llevarlo a la orilla de la ${nm(E)} y elevar la cabecera a Fowler`, ok:true},
          {t:'Sentarlo en el borde con las piernas colgando', danger:true, fb:'Si no colabora, no se mantendrá sentado. Se traslada desde Fowler, en la orilla.'},
          {t:'Dejarlo en el centro de la cama', fb:'Tiene que estar en la orilla, lo más cerca posible de la silla.'}
        ], a:S=>{S.px=s; S.bedHead='fowler'; S.pillow='headboard'; setAux(S,[['A1',AX(E),YY.chest],['A2',AX(E),YY.thighs+20]]);}},
      {type:'multi', q:'Prepara la silla de ruedas. Marca todo lo que haces.', ck:'Silla paralela y pegada, respaldo a la cabecera, sin reposabrazos del lado de la cama, reposapiés arriba y frenada',
        items:[{t:'Paralela y pegada a la cama', ok:true},{t:'Con el respaldo hacia la cabecera', ok:true},{t:'Quito el reposabrazos del lado de la cama', ok:true},{t:'Levanto los reposapiés', ok:true},{t:'La freno', ok:true},{t:'La dejo a un metro, para tener sitio'},{t:'Con el respaldo hacia los pies de la cama'}],
        fb:'Silla preparada: pegada, sin obstáculos y frenada.',
        a:S=>{S.chair={x:220+s*124, y:282, r:0, brake:true, foot:'up', noArm:-s}; setAux(S,[['A1',220+s*124,206],['A2',220+s*124,360]]);}},
      {type:'choice', q:'¿Cómo os colocáis?', ck:'Aux. 1 detrás del respaldo; Aux. 2 frente al paciente, en la misma orilla',
        opts:[
          {t:'Aux. 1 detrás del respaldo de la silla; Aux. 2 frente al paciente, en la misma orilla de la cama', ok:true},
          {t:'Uno a cada lado de la cama', fb:'Los dos trabajáis en la orilla de la silla: uno detrás del respaldo y otro frente al paciente.'}
        ]},
      {type:'choice', q:'¿Qué hace el Aux. 1?', ck:'Aux. 1: brazos bajo las axilas, sujeta la parte inferior de los antebrazos cruzados',
        opts:[
          {t:'Pasa sus brazos bajo las axilas del paciente, que tiene los antebrazos cruzados sobre el tórax, y lo sujeta por la parte inferior de los antebrazos', ok:true},
          {t:'Lo sujeta por las muñecas y tira', danger:true, fb:'Tirar de las muñecas puede lesionar al paciente. Pasa los brazos bajo sus axilas y sujeta sus antebrazos cruzados.'}
        ], a:S=>{S.arm={p:'cross',v:'cross'}}},
      {type:'choice', q:'¿Y el Aux. 2?', ck:'Aux. 2: lo sujeta por debajo de los muslos',
        opts:[
          {t:'Lo sujeta por debajo de los muslos', ok:true},
          {t:'Lo sujeta por los tobillos', fb:'Desde los tobillos no soporta el peso. El Aux. 2 sujeta por debajo de los muslos.'}
        ]},
      posture(),
      {type:'choice', q:'¿Cómo lo pasáis a la silla?', ck:'Movimiento simultáneo a la señal',
        opts:[
          {t:'A la señal, en un movimiento simultáneo, lo pasamos a la silla', ok:true},
          {t:'Tira primero el Aux. 1 y luego acompaña el Aux. 2', fb:'Si no os movéis a la vez, el cuerpo se dobla. Uno da la señal y os movéis juntos.'}
        ], a:S=>{S.pose='silla'}},
      {type:'choice', ctx:'Ya está en la silla.', q:'¿Qué te falta?', ck:'Coloca bien los reposapiés y lo tapa con una manta si hace falta',
        opts:[
          {t:'Coloco bien los reposapiés y, si hace falta, lo tapo con una manta', ok:true},
          {t:'Lo dejo con los pies colgando', fb:'Los reposapiés se bajan y sus pies quedan apoyados.'}
        ], a:S=>{S.chair.foot='down'; S.blanket=true; S.arm={p:'side',v:'side'};}},
      cierre()
    ];
  }
},
{ id:6, cat:'Traslado', name:'Cama a camilla', para:'Trasladar al paciente tumbado, por ejemplo a una prueba o al quirófano.', personal:'1 auxiliar · 3 si no colabora', variants:true,

      {type:'choice', q:'¿Cómo colocas la camilla?', ck:'Camilla paralela a la cama y las dos frenadas',
        opts:[
          {t:`Paralela a la cama, pegada por el lado de la ${nm(E)}, y freno las dos`, ok:true},
          {t:'Paralela, pero solo freno la cama', danger:true, fb:'Error frecuente: si la camilla no está frenada, se desplaza durante el traslado.'},

/* ---------- dibujo ---------- */
const limb = (pts, w, cls='limb') => `<path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1]).join(' L')}" class="${cls}" stroke-width="${w}"/>`;
function arm(side, mode){
  const k=sg(side);
  const P={side:[[36,-96],[38,-10]], tight:[[30,-96],[30,-10]], out:[[36,-96],[84,-44]], flex:[[36,-96],[38,-52],[8,-40]],
           cross:[[34,-96],[30,-68],[-20,-80]], up:[[36,-96],[42,-140],[36,-184]]}[mode] || [[36,-96],[38,-10]];
  const pts=P.map(([x,y])=>[x*k,y]); const e=pts[pts.length-1];
  return limb(pts,13)+`<circle cx="${e[0]}" cy="${e[1]}" r="6.5" class="skin"/>`;
}
function leg(side, mode, prone){
  const k=sg(side);
  const P={straight:[[13,0],[14,124]], flex:[[13,0],[21,62],[18,92]], cross:[[13,0],[-10,116]]}[mode] || [[13,0],[14,124]];
  const pts=P.map(([x,y])=>[x*k,y]); const e=pts[pts.length-1];
  let h=limb(pts,20);
  if(mode==='flex') h+=`<circle cx="${21*k}" cy="62" r="9" class="knee"/>`;
  h+=`<ellipse cx="${e[0]}" cy="${e[1]+9}" rx="7" ry="9" class="${prone?'skin':'skin'}"/>`;
  return h;
}
function sheet(w){ return `<rect x="${-w/2}" y="-94" width="${w}" height="246" rx="12" class="sheet"/><rect x="${-w/2}" y="-94" width="${w}" height="16" rx="8" class="sheetFold"/>`; }
function supine(S){
  let h='';
  if(S.entre) h+=`<rect x="-62" y="-104" width="124" height="150" rx="6" class="entre"/>`;
  const legs=['p','v'].sort((a,b)=>(S.leg[a]==='cross')-(S.leg[b]==='cross'));
  legs.forEach(s=>{ if(S.leg[s]!=='cross') h+=leg(s,S.leg[s]); });
  h+=`<rect x="-30" y="-112" width="60" height="120" rx="22" class="gown"/>`;
  legs.forEach(s=>{ if(S.leg[s]==='cross') h+=leg(s,'cross'); });
  if(S.covered) h+=sheet(108);
  h+=arm('p',S.arm.p)+arm('v',S.arm.v);
  h+=`<circle cx="0" cy="-128" r="16" class="skin"/><ellipse cx="0" cy="-139" rx="14.5" ry="7.5" class="hair"/>
      <circle cx="-5.5" cy="-127" r="1.7" class="eye"/><circle cx="5.5" cy="-127" r="1.7" class="eye"/>`;
  return h;
}
function prone(S){
  let h=leg('p','straight',true)+leg('v','straight',true);
  h+=`<rect x="-30" y="-112" width="60" height="120" rx="22" class="gown"/><path d="M0 -104 L0 -2" class="spine"/>
      <path d="M-18 -92 Q-12 -80 -4 -84 M18 -92 Q12 -80 4 -84" class="spine"/>`;
  if(S.covered) h+=sheet(108);
  h+=arm('p','side')+arm('v','side');
  h+=`<circle cx="0" cy="-128" r="16" class="hair"/>`;
  if(S.headTurn){ const k=sg(S.headTurn); h+=`<ellipse cx="${k*11}" cy="-127" rx="6" ry="11" class="skin"/><circle cx="${k*13}" cy="-131" r="1.6" class="eye"/>`; }
  return h;
}
function lateral(S){
  const k=sg(S.facing), sup=S.pillow==='supports';
  let h='';
  if(sup) h+=`<rect x="${-k*33-9}" y="-104" width="18" height="104" rx="8" class="pillow"/>`;

  if(sup) h+=`<rect x="${k*16-11}" y="30" width="22" height="64" rx="9" class="pillow"/>`;

  if(S.covered) h+=`<rect x="-42" y="-94" width="84" height="236" rx="16" class="sheet"/><rect x="-42" y="-94" width="84" height="16" rx="8" class="sheetFold"/>`;
  h+=limb([[k*8,-98],[k*44,-84]],13)+`<circle cx="${k*48}" cy="-82" r="6.5" class="skin"/>`;
  if(sup) h+=`<rect x="${k*38-13}" y="-74" width="26" height="54" rx="10" class="pillow"/>`;
  h+=limb([[k*12,-98],[k*30,-58],[k*36,-26]],13)+`<circle cx="${k*36}" cy="-22" r="6.5" class="skin"/>`;
  h+=`<circle cx="0" cy="-128" r="16" class="skin"/>

      <circle cx="${k*16}" cy="-126" r="3.6" class="skin"/><circle cx="${k*9}" cy="-131" r="1.7" class="eye"/>`;
  return h;
}
function seated(S){
  const cross=S.arm.p==='cross';

  let h='';
  h+=limb([[-12,4],[-13,50]],18)+limb([[12,4],[13,50]],18);

function standing(S){

function drawPatient(S){
  if(S.pose==='supino'||S.pose==='camilla') return supine(S);
  if(S.pose==='prono') return prone(S);
  if(S.pose==='lateral') return lateral(S);
  if(S.pose==='sentado'||S.pose==='silla') return seated(S);

  switch(S.pose){
    case 'sentado': return {x:220+sg(S.sitSide)*50, y:240, r:S.sitSide==='v'?-90:90, s:1};

function drawScene(S, instant){

    .map(([l,on])=>`<span class="chip${on?' on':''}">${l}</span>`).join('');

  <div class="grid">${FICHAS.map(f=>`

  $('#mSim').onclick=()=>{mode='sim'; store.set('movi-mode',mode); home();};

function makeCase(f, forced){
  const c=Object.assign({side:rnd(['p','v']), colab:Math.random()<.5, p:rnd(PAC), dizzy:Math.random()<.5}, forced||{});
  f.setup(c);
  return c;
}

function startSim(f){
  token++; stopSubs(); view.dataset.v='sim';
  const c=makeCase(f);
  const S=baseState(); f.init(S,c);
  cur={f, c, S, steps:f.steps(c), i:-1, firstOk:0, errs:[], stepErr:false};
  view.innerHTML=`
  <div class="simTop">
    <button class="ghost" id="back">← Fichas</button>
    <div class="simTitle"><span class="eyebrow">Ficha ${f.id} · ${f.cat}</span><h2>${f.name}</h2></div>
  </div>
  <div class="simGrid">
    <div class="sceneBox">${sceneSVG()}<div class="chips" id="chips"></div></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>`;
  $('#back').onclick=home;
  drawScene(S,true);
  brief();
  window.scrollTo(0,0);
}

function brief(){
  const {f,c}=cur;
  const colabTxt = c.colabTxt || (f.variants ? (c.colab ? 'Consciente y orientado: puede colaborar.' : 'Muy debilitado y somnoliento: no puede colaborar.') : 'Consciente y orientado.');
  $('#panel').innerHTML=`
    <span class="eyebrow">Caso</span>
    <h3>${esc(c.p.n)}, ${c.p.e} años</h3>
    <dl class="case">
      <dt>Estado</dt><dd>${colabTxt}</dd>
      <dt>Objetivo</dt><dd>${c.goal}</dd>
      <dt>Para qué</dt><dd>${f.para}</dd>
    </dl>
    <p class="hint">La puerta está a la izquierda de la escena y la ventana a la derecha. Si fallas, verás por qué y podrás corregir, pero el fallo queda registrado.</p>
    <button class="primary" id="go">Empezar</button>`;
  $('#go').onclick=()=>{cur.i=0; cur.t0=Date.now(); step();};
}

function later(fn, ms){ const t=token; setTimeout(()=>{ if(t!==token||!cur) return; fn(); drawScene(cur.S); }, ms); }
function danger(){
  const b=$('.sceneBox'); if(!b) return;
  b.classList.remove('danger'); void b.offsetWidth; b.classList.add('danger');
  setTimeout(()=>b.classList.remove('danger'),900);
  try{ navigator.vibrate && navigator.vibrate(70); }catch(e){}
}
function logErr(st, t, fb){
  if(!cur.stepErr){ cur.stepErr=true; }
  cur.errs.push({q:st.q, t, fb});
}

function step(){
  const st=cur.steps[cur.i], n=cur.steps.length;
  cur.stepErr=false;
  const panel=$('#panel');
  panel.innerHTML=`
    <div class="prog"><span>Paso ${cur.i+1} de ${n}</span><div class="bar"><i style="width:${(cur.i)/n*100}%"></i></div></div>
    ${st.ctx?`<p class="ctx">${st.ctx}</p>`:''}
    <h3>${st.q}</h3>
    <div class="opts${st.fig?' figs':''}" id="opts"></div>
    <div class="fb" id="fb" hidden></div>
    <button class="primary" id="next" hidden>${cur.i===n-1?'Ver resultado':'Continuar'}</button>`;
  const opts=$('#opts'), fb=$('#fb'), next=$('#next');
  const showFb=(ok, txt)=>{ fb.hidden=false; fb.className='fb '+(ok?'ok':'bad'); fb.innerHTML=`<b>${ok?'Correcto.':'No es así.'}</b> ${txt||''}`; };
  const done=(txt)=>{
    if(!cur.stepErr) cur.firstOk++;
    showFb(true, txt); next.hidden=false;
    panel.querySelector('.bar i').style.width=((cur.i+1)/n*100)+'%';
    next.focus({preventScroll:true});
  };
  next.onclick=()=>{ cur.i++; if(cur.i>=n) result(); else { step(); if(window.innerWidth<880) panel.scrollIntoView({block:'nearest'}); } };

  if(st.type==='choice'){
    shuffle(st.opts).forEach(o=>{
      const b=document.createElement('button');
      b.className='opt'; b.innerHTML=(o.fig?figSVG(o.fig):`<span class="mk"></span>`)+`<span>${o.t}</span>`;
      b.onclick=()=>{
        if(o.ok){
          opts.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x!==b) x.classList.add('dim');});
          b.classList.remove('dim'); b.classList.add('ok'); if(!o.fig) b.querySelector('.mk').textContent='✓';
          if(st.a) st.a(cur.S, later); if(o.a) o.a(cur.S);
          drawScene(cur.S); done(o.fb);
        } else {
          b.classList.add('bad'); b.disabled=true; if(!o.fig) b.querySelector('.mk').textContent='✕';
          logErr(st,o.t,o.fb); showFb(false,o.fb); if(o.danger) danger();
        }
      };
      opts.appendChild(b);
    });
  }
  else if(st.type==='order'){
    let k=0;
    const items=st.items.map((it,idx)=>Object.assign({idx},it));
    shuffle(items).forEach(it=>{
      const b=document.createElement('button');
      b.className='opt'; b.innerHTML=`<span class="mk"></span><span>${it.t}</span>`;
      b.onclick=()=>{
        if(it.idx===k){
          k++; b.disabled=true; b.classList.remove('bad'); b.classList.add('ok'); b.querySelector('.mk').textContent=k;
          if(it.a){ it.a(cur.S); drawScene(cur.S); }
          fb.hidden=true;
          if(k===st.items.length) done(st.fb);
        } else {
          b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),700);
          logErr(st, it.t+' (fuera de orden)', st.wrong); showFb(false, st.wrong);
        }
      };
      opts.appendChild(b);
    });
  }
  else if(st.type==='multi'){
    const sel=new Set();
    shuffle(st.items).forEach(it=>{
      const b=document.createElement('button');
      b.className='opt'; b.setAttribute('aria-pressed','false'); b.innerHTML=`<span class="mk"></span><span>${it.t}</span>`;
      b.onclick=()=>{ if(sel.has(it)){sel.delete(it); b.classList.remove('sel'); b.setAttribute('aria-pressed','false'); b.querySelector('.mk').textContent='';} else {sel.add(it); b.classList.add('sel'); b.setAttribute('aria-pressed','true'); b.querySelector('.mk').textContent='✓';} };
      b._it=it; opts.appendChild(b);
    });
    const chk=document.createElement('button'); chk.className='primary'; chk.textContent='Comprobar';
    opts.after(chk);
    chk.onclick=()=>{
      const wrongSel=[...sel].filter(i=>!i.ok), missing=st.items.filter(i=>i.ok && !sel.has(i));
      if(!wrongSel.length && !missing.length){
        chk.remove();
        opts.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x._it.ok){x.classList.remove('sel'); x.classList.add('ok');} else x.classList.add('dim');});
        if(st.a) st.a(cur.S, later); drawScene(cur.S); done(st.fb);
      } else {
        let msg=''; if(wrongSel.length) msg+=`Sobra: ${wrongSel.map(i=>i.t.toLowerCase()).join('; ')}. `;
        if(missing.length) msg+=`Te falta ${missing.length===1?'una opción':missing.length+' opciones'}.`;
        logErr(st, 'Selección incompleta o con errores', msg); showFb(false,msg);
      }
    };
  }
}

function result(){
  const {f,c,steps,firstOk,errs}=cur, n=steps.length;
  const uniq=[]; const seen=new Set(); errs.forEach(e=>{ const k=e.q+e.t; if(!seen.has(k)){seen.add(k); uniq.push(e);} });
  if (!CAP.owner){
    const att={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), f:f.id, ok:firstOk, n,
      colab: f.variants ? !!c.colab : null, t:new Date().toISOString(), dur:Math.round((Date.now()-(cur.t0||Date.now()))/1000),
      errs: uniq.slice(0,10).map(e=>cut(e.t,90)), nombre: alumno?alumno.nombre:'', grupo: alumno?alumno.grupo:''};
    return studentResult(f, att);
  }
  const pct=Math.round(firstOk/n*100);
  const best=bestAll(); if(best[f.id]==null || pct>best[f.id]){ best[f.id]=pct; store.set('movi-best',best); }
  const lbl = pct>=90 ? 'Procedimiento seguro' : pct>=70 ? 'Casi: repasa los fallos' : 'Repite la ficha';
  $('#panel').innerHTML=`
    <span class="eyebrow">Resultado</span>
    <div class="score"><b>${pct}%</b><span>${lbl}</span></div>
    <p class="hint">${firstOk} de ${n} pasos acertados a la primera.</p>
    ${uniq.length?`<h3>Tus fallos</h3><div class="errs">${uniq.map(e=>`<div class="err"><span>${e.q}</span><i>${e.t}</i><span>${e.fb||''}</span></div>`).join('')}</div>`:'<p>Sin fallos. Prueba otro caso: cambia el paciente y el lado.</p>'}
    <div class="box2">
      <div class="kbox k"><h4>Puntos clave</h4><ul class="lst">${f.clave.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="kbox e"><h4>Errores frecuentes</h4><ul class="lst">${f.errores.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="row"><button class="primary" id="again">Otro caso</button><button class="ghost" id="list">Elegir otra ficha</button></div>`;
  $('#again').onclick=()=>startSim(f);
  $('#list').onclick=home;
}

function studentResult(f, att){
  $('#panel').innerHTML=`
    <span class="eyebrow">Ficha completada</span>
    <h3>${f.name}</h3>
    <p class="hint">Puedes repetirla con otro caso: todos tus intentos quedan registrados.</p>
    <div class="fb ok" id="saveBox" role="status">Guardando tu intento…</div>
    <div class="box2">
      <div class="kbox k"><h4>Puntos clave</h4><ul class="lst">${f.clave.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="kbox e"><h4>Errores frecuentes</h4><ul class="lst">${f.errores.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="row"><button class="primary" id="again">Otro caso</button><button class="ghost" id="list">Elegir otra ficha</button></div>`;
  $('#again').onclick=()=>startSim(f);
  $('#list').onclick=home;
  const t=token;
  pushHist(att);
  saveAttempt(att).then(r=>{
    if (t!==token) return;
    const box=$('#saveBox'); if(!box) return;
    if (r.ok){ box.innerHTML='<b>Intento guardado.</b> Tu profesor lo verá en su panel.'; return; }
    const code=encCode({n:att.nombre, g:att.grupo, a:slimAtt(att,6,70)});
    box.className= STANDALONE ? 'fb ok' : 'fb bad';
    box.innerHTML= (STANDALONE
      ? `<b>Intento registrado.</b> Este es el código de esta ficha. Si al final de la sesión entregas «Mi código de entrega» (en la portada), no hace falta que entregues este.`
      : `<b>No se ha podido guardar desde aquí.</b> Copia este código y entrégaselo a tu profesor por el canal que te indique. También puedes entregar todos tus intentos juntos desde «Mi código de entrega», en la portada.`) + `
      <textarea class="code" id="codeTa" readonly aria-label="Código de entrega" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:8px"><button class="primary" id="copyC">Copiar código</button></div>`;
    const ta=$('#codeTa'); ta.value=code;
    $('#copyC').onclick=async()=>{ const ok=await copyText(code, ta); $('#copyC').textContent = ok?'Código copiado':'Selecciona el texto y cópialo'; };
  });
}

/* ---------- panel de notas (solo propietario) ---------- */
let unsubs=[];
function stopSubs(){ unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs=[]; }
function notas(){}
/* ---------- lista de observación ---------- */
function checklist(f, colab){
  token++; cur=null; stopSubs(); view.dataset.v='chk';
  const c=makeCase(f,{side:'v', colab, dizzy:false, p:PAC[0]});
  const items=f.steps(c).map(s=>s.ck);
  const state=new Set(), errs=new Set();
  const render=()=>{
    view.innerHTML=`
    <div class="simTop">
      <button class="ghost" id="back">← Fichas</button>
      <div class="simTitle"><span class="eyebrow">Ficha ${f.id} · Lista de observación</span><h2>${f.name}</h2></div>
    </div>
    <div class="chk">
      ${f.variants?`<div class="tabs" role="group" aria-label="Paciente">
        <button id="vc" aria-pressed="${!!colab}">Colabora</button><button id="vn" aria-pressed="${!colab}">No colabora</button></div>`:''}
      <div class="tip"><span class="eyebrow">Cómo practicarlo sin cama ni maniquí</span><p>${f.aula}</p>
        <p class="hint">Personal: ${c.n===3?'al menos 3 auxiliares':c.n===1?'1 auxiliar':c.n+' auxiliares'}. El alumno que hace de paciente puede decir «para» en cualquier momento.</p></div>
      <h3>Pasos observados</h3>
      <div class="opts">${items.map((t,i)=>`<button class="citem" data-i="${i}" aria-pressed="${state.has(i)}"><span class="bx">${state.has(i)?'✓':''}</span><span class="n">${i+1}</span><span>${t}</span></button>`).join('')}</div>
      <h3>Errores observados</h3>
      <div class="opts">${f.errores.map((t,i)=>`<button class="citem er" data-e="${i}" aria-pressed="${errs.has(i)}"><span class="bx">${errs.has(i)?'✕':''}</span><span>${t}</span></button>`).join('')}</div>
      <div class="sticky"><span class="tally">${state.size} / ${items.length} pasos${errs.size?` · ${errs.size} error${errs.size>1?'es':''}`:''}</span><button class="ghost" id="reset">Vaciar lista</button></div>
    </div>`;
    $('#back').onclick=home;
    if(f.variants){ $('#vc').onclick=()=>checklist(f,true); $('#vn').onclick=()=>checklist(f,false); }
    view.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; state.has(i)?state.delete(i):state.add(i); keep(); });
    view.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.e; errs.has(i)?errs.delete(i):errs.add(i); keep(); });
    $('#reset').onclick=()=>{ state.clear(); errs.clear(); keep(); };
  };
  const keep=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  render(); window.scrollTo(0,0);
}

home();
})();
</script>
